{% extends 'base.html' %}

{% block title %}Upload Resume | ScreenAI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="glass-card shadow-lg p-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mb-3 animate-bounce" style="width: 70px; height: 70px;">
                        <i class="bi bi-cloud-arrow-up fs-2"></i>
                    </div>
                    <h2 class="fw-bold">Upload Resume</h2>
                    <p class="text-muted">Upload your CV/Resume in PDF or DOCX format to parse skills and calculate ATS score.</p>
                </div>

                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Select Resume File</label>
                        {{ form.resume_file }}
                        <div class="form-text text-muted small mt-2">
                            <i class="bi bi-info-circle-fill me-1"></i> Supported formats: <strong>.pdf</strong>, <strong>.docx</strong>
                        </div>
                    </div>

                    <div class="d-grid mt-5">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill">
                            <i class="bi bi-cloud-arrow-up me-2"></i> Upload & Analyze
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
